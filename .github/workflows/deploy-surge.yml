# Deploy templates to Surge.sh — one subdomain per template.
#
# Triggers:
#   1. push to `main`. Every template PR is squash-merged into main, so this is
#      the reliable place to react: unlike the old `pull_request: [closed]`
#      trigger it cannot be killed by `gh pr merge --delete-branch` (deleting
#      the branch cancels the in-flight run — that race left 141 template apps
#      merged but never published, see docs/adr/0004). Apps touched by the push
#      are verified (scripts/verify-app.sh), deployed, then re-probed.
#      The re-probe calls scripts/audit-deployments.sh, which also probes the
#      Surge origin: a branded edge that serves no certificate for the hostname
#      (`edge-*` classes) is reported, not treated as a failed deploy.
#   2. nightly schedule — fleet audit + repair: probe every template domain and
#      rebuild/redeploy the apps whose site is missing, so a cancelled or failed
#      deploy heals itself instead of leaving a dead public link.
#   3. workflow_dispatch — deploy specific apps (`app`, space-separated) and/or
#      run the audit+repair with a custom cap (`audit_limit`, default 40 per
#      shard). With `app` empty only the audit/repair job runs.
#
# REQUIRED repository secrets (Settings > Secrets and variables > Actions):
#   SURGE_LOGIN — the Surge.sh account email
#   SURGE_TOKEN — from `npx surge token` (after `npx surge login`)
#
# The deploy itself runs `scripts/deploy-template.sh <app>`, which builds the
# workspace (`tsc --noEmit && vite build`, so broken code can never ship), adds
# the SPA 200.html fallback, and runs `npx surge` (headless, authenticated via
# the two secrets).

name: Deploy to Surge.sh

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 4 * * *' # 04:30 UTC daily, after the nightly gate
  workflow_dispatch:
    inputs:
      app:
        description: 'App folder(s) to deploy, space-separated (e.g. "aurora drift"). Leave empty to only run the audit/repair job.'
        required: false
        type: string
      audit_limit:
        description: 'Max apps the audit/repair job redeploys per shard (default 40).'
        required: false
        default: '40'
        type: string

permissions:
  contents: read

# Serialize deploy/repair runs so two jobs never push to Surge at once.
concurrency:
  group: deploy-surge
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify + deploy changed templates
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.app != '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the push diff needs history

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine apps to deploy
        id: apps
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REQUESTED: ${{ inputs.app }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            APPS="$REQUESTED"
            UI_CHANGED=false
          else
            if [ -z "$AFTER" ] || [ "$AFTER" = "0000000000000000000000000000000000000000" ]; then
              AFTER="$(git rev-parse HEAD)"
            fi
            # A force-push / initial push has no usable `before` commit: fall back
            # to the pushed commit's parent so the diff still describes the change.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BEFORE="$(git rev-parse "${AFTER}~1" 2>/dev/null || echo '')"
            fi
            if [ -n "$BEFORE" ]; then
              CHANGED="$(git diff --name-only "$BEFORE" "$AFTER")"
            else
              CHANGED="$(git show --name-only --pretty=format: "$AFTER")"
            fi
            APPS="$(printf '%s\n' "$CHANGED" | sed -n 's|^apps/\([^/]*\)/.*|\1|p' | sort -u | tr '\n' ' ')"
            if printf '%s\n' "$CHANGED" | grep -q '^packages/ui/'; then UI_CHANGED=true; else UI_CHANGED=false; fi
          fi
          echo "APPS=${APPS}" >> "$GITHUB_ENV"
          echo "UI_CHANGED=${UI_CHANGED}" >> "$GITHUB_ENV"
          echo "Detected app(s): ${APPS:-none} (packages/ui changed: ${UI_CHANGED})"

      - name: Verify changed apps (per-app gate)
        if: env.APPS != ''
        run: |
          set +e
          failed=""
          for app in $APPS; do
            echo "==> Gate: ${app}"
            if bash scripts/verify-app.sh "$app"; then
              echo "==> OK: ${app}"
            else
              echo "==> GATE FAILED: ${app}"
              failed="${failed} ${app}"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Gate failed:${failed}"
            exit 1
          fi
          echo "Gate passed for: ${APPS}"

      - name: Verify shared UI (packages/ui touched)
        if: env.UI_CHANGED == 'true'
        run: |
          npm run typecheck --workspace @free-react-templates/ui
          npx vitest run --root packages/ui \
            --coverage.enabled=true --coverage.provider=v8 \
            --coverage.include='src/**' \
            --coverage.exclude='**/*.test.*' \
            --coverage.thresholds.lines=100 --coverage.thresholds.functions=100 \
            --coverage.thresholds.branches=100 --coverage.thresholds.statements=100

      - name: Deploy each template to its Surge subdomain
        if: env.APPS != ''
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          # Deploy every app even if some fail; report failures and fail the job
          # only when at least one deploy failed (the nightly audit re-deploys
          # whatever is still missing).
          set +e
          failed=""
          for app in $APPS; do
            echo "==> Deploying ${app} to https://${app}.free.componentdock.com"
            if bash scripts/deploy-template.sh "${app}"; then
              echo "==> OK: ${app}"
            else
              echo "==> FAILED: ${app}"
              failed="${failed} ${app}"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::One or more deploys failed:${failed}"
            exit 1
          fi
          echo "All deploys succeeded."

      - name: Verify the deployments are live
        if: env.APPS != ''
        run: |
          # A branded edge without a certificate for the hostname (Cloudflare
          # second-level wildcard) kills the handshake, so a plain probe cannot
          # tell "deploy failed" apart from "edge is down". audit-deployments.sh
          # probes the origin as well and classifies each host; only `missing`
          # (no content anywhere) fails the step.
          set +e
          bash scripts/audit-deployments.sh --apps "$APPS" --quiet > verify.tsv 2>/dev/null
          status=$?
          edge=""
          while IFS=$'\t' read -r class app; do
            case "$class" in
              live) echo "==> live: ${app}" ;;
              insecure) echo "==> live, shared *.surge.sh cert: ${app}" ;;
              edge-live) echo "==> live at the origin, unreachable via the branded edge (TLS): ${app}"; edge="${edge} ${app}" ;;
              edge-insecure) echo "==> origin only + shared *.surge.sh cert (needs re-publish): ${app}"; edge="${edge} ${app}" ;;
              missing) echo "==> NOT LIVE anywhere (no content at the origin): ${app}" ;;
            esac
          done < verify.tsv
          if [ -n "$edge" ]; then
            echo "::error::Branded edge has no certificate for:${edge} — the hosts serve fine at the Surge origin. This is a DNS/TLS-edge problem (Cloudflare-proxied *.free.componentdock.com needs a multi-level cert or a DNS-only CNAME to na-west1.surge.sh), NOT a deploy failure."
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::Not published anywhere: see the NOT LIVE lines above."
            exit 1
          fi
          echo "All deployments are published (edge/TLS state reported above)."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy (${GITHUB_EVENT_NAME})"
            echo ""
            echo "- apps: \`${APPS:-none}\`"
            echo "- packages/ui changed: \`${UI_CHANGED:-false}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Fleet audit + repair (shard ${{ matrix.shard }}/4)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit published templates (shard ${{ matrix.shard }}/4)
        id: audit
        env:
          AUDIT_LIMIT: ${{ inputs.audit_limit || '40' }}
        run: |
          set -euo pipefail
          bash scripts/audit-deployments.sh \
            --shard ${{ matrix.shard }} --total 4 --limit "$AUDIT_LIMIT" --jobs 16 \
            | tee audit.tsv
          MISSING="$(awk -F'\t' '$1 == "missing" { print $2 }' audit.tsv | tr '\n' ' ' | sed 's/ *$//')"
          INSECURE="$(awk -F'\t' '$1 == "insecure" { print $2 }' audit.tsv | tr '\n' ' ' | sed 's/ *$//')"
          EDGE="$(awk -F'\t' '$1 == "edge-live" || $1 == "edge-insecure" { print $2 }' audit.tsv | tr '\n' ' ' | sed 's/ *$//')"
          echo "MISSING=${MISSING}" >> "$GITHUB_ENV"
          echo "INSECURE=${INSECURE}" >> "$GITHUB_ENV"
          echo "EDGE=${EDGE}" >> "$GITHUB_ENV"
          echo "Repairing (≤ ${AUDIT_LIMIT}): ${MISSING:-none}"
          {
            echo "### Audit shard ${{ matrix.shard }}/4"
            echo ""
            echo "- missing (repairing): ${MISSING:-none}"
            echo "- TLS-uncovered cert (report only): ${INSECURE:-none}"
            echo "- branded edge down, content healthy at the origin (no deploy can fix): ${EDGE:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Redeploy the missing templates
        if: env.MISSING != ''
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          set +e
          failed=""
          for app in $MISSING; do
            echo "==> Rebuilding + deploying ${app}"
            if bash scripts/deploy-template.sh "${app}"; then
              echo "==> OK: ${app}"
            else
              echo "==> FAILED: ${app}"
              failed="${failed} ${app}"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Repair deploys failed:${failed}"
            exit 1
          fi
          echo "Repaired: ${MISSING}"

      - name: Verify repaired deployments are live
        if: env.MISSING != ''
        run: |
          # Same probe as the deploy job: `missing` anywhere is the only failure,
          # a branded edge that cannot serve TLS is reported, not retried.
          set +e
          bash scripts/audit-deployments.sh --apps "$MISSING" --quiet > repaired.tsv 2>/dev/null
          status=$?
          while IFS=$'\t' read -r class app; do
            echo "==> ${class}: ${app}"
          done < repaired.tsv
          if [ "$status" -ne 0 ]; then
            echo "::error::Still not published anywhere after repair: see the missing lines above."
            exit 1
          fi
          echo "All repaired deployments are published."

      - name: Report TLS-uncovered hosts (not auto-fixable in-repo)
        if: env.INSECURE != ''
        run: |
          echo "These hosts are published but answer with a TLS certificate that" \
            "does not cover them (Surge's shared CN=*.surge.sh cert), so browsers" \
            "warn on the https:// link: ${INSECURE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Report a branded-edge TLS outage (not fixable in this repo)
        if: env.EDGE != ''
        run: |
          cat <<EOF
          ::error::The branded domain *.free.componentdock.com serves no TLS certificate for ${EDGE}
          These hosts answer 200 with a valid per-domain certificate at the Surge origin
          (--resolve <host>:443:<surge-ip>), so their content is published and healthy.
          The failure is in front of Surge: the wildcard DNS record is Cloudflare-proxied
          and Cloudflare's certificate does not cover a second-level wildcard
          (*.free.componentdock.com). Re-publishing cannot fix it.

          Fix at the DNS/TLS edge, then re-run this job:
            - set *.free.componentdock.com to a DNS-only CNAME -> na-west1.surge.sh, or
            - add a multi-level certificate (Cloudflare Advanced Certificate Manager).
          After the edge serves TLS again, hosts reported as edge-insecure need one
          per-domain re-publish (surge apps/<app>/dist https://<app>.free.componentdock.com).
          EOF
          exit 1
