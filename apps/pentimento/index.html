    <script>
      ;(function () {
        try {
          var stored = window.localStorage.getItem('theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch (error) {
          document.documentElement.classList.remove('dark')
        }
      })()
    </script>
