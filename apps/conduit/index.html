<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Trenchless sewer repair in Tampa, compared honestly against digging. Book a camera survey, see the footage, and get both prices — relining and open cut — in writing."
    />
    <meta name="theme-color" content="#974e2c" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Conduit — fix the pipe, keep the driveway" />
    <meta
      property="og:description"
      content="Relining against digging, row by row. A camera survey before anyone quotes a repair, the footage yours to keep, and both prices every time."
    />
    <meta property="og:url" content="https://conduit.free.componentdock.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;700&display=swap"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23974e2c'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23f6f6f4' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23f6f6f4'/%3E%3C/svg%3E"
    />
    <script>
      // Resolve the theme before first paint so a reload never flashes light.
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (error) {
          void error
        }
      })()
    </script>
    <title>Conduit — trenchless sewer repair in Tampa, compared honestly against digging</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
