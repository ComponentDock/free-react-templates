<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A graphic design studio working in identity, editorial, packaging and type. Six people, print-first, and a deliverables list published before you ask for it."
    />
    <meta name="theme-color" content="#f7f7f6" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Makeready — design that survives contact with production" />
    <meta
      property="og:description"
      content="Identity, editorial, packaging and type, finished to the point where a printer can use the files and a non-designer can follow the guidelines."
    />
    <meta property="og:url" content="https://makeready.free.componentdock.com" />
    <meta property="og:image" content="https://picsum.photos/seed/makeready-og/1200/630" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%23f7f7f6'/%3E%3Crect x='4' y='7' width='14' height='14' rx='2' fill='%23141413'/%3E%3Crect x='14' y='12' width='14' height='14' rx='2' fill='%23c3f53c'/%3E%3Crect x='14' y='12' width='4' height='9' fill='%2384b012'/%3E%3C/svg%3E"
    />
    <title>Makeready — design that survives contact with production</title>
    <script>
      ;(function () {
        try {
          var stored = window.localStorage.getItem('theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch (error) {
          document.documentElement.classList.remove('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
