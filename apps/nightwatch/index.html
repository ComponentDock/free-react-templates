<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Commercial cleaning in Indianapolis, priced by cleanable square footage. Put your building in, get an indicative monthly range now, and a written proposal within one working day."
    />
    <meta name="theme-color" content="#0d1522" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nightwatch — square footage in, a number out" />
    <meta
      property="og:description"
      content="Published janitorial rates and a square-footage estimator. A range before you speak to anyone, a written proposal inside one working day."
    />
    <meta property="og:url" content="https://nightwatch.free.componentdock.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1522'/%3E%3Cpath d='M9 23V9l14 14V9' stroke='%23f0b429' stroke-width='3' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // Resolve the theme before first paint so a reload never flashes light.
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (error) {
          void error
        }
      })()
    </script>
    <title>Nightwatch — commercial cleaning, priced by the square foot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
