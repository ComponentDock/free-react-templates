<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Airwave — a free podcast landing template with featured and recent episodes, host bio, sponsors, listener testimonials, newsletter, FAQ, and contact form, built with React, Tailwind CSS, and TypeScript."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      /* Prevent dark-mode flash: dark is the DEFAULT experience (the demo
         ships dark-first); apply the persisted preference before paint. */
      try {
        if (localStorage.getItem('airwave-dark') !== '0') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {
        /* ignore */
      }
    </script>
    <title>Airwave — Podcast</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
