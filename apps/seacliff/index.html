<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Seacliff — a free luxury resort hotel landing template with hero booking widget, rooms & suites, amenities, dining venues, gallery, guest testimonials, FAQ, and newsletter, built with React, Tailwind CSS, and TypeScript."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      /* Prevent dark-mode flash: the demo ships light-first; apply the
         persisted dark preference only when explicitly enabled. */
      try {
        if (localStorage.getItem('seacliff-dark') === '1') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {
        /* ignore */
      }
    </script>
    <title>Seacliff — Luxury Resort Hotel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
